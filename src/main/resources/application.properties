spring.application.name=chiikawa

server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

# Mustache
spring.mustache.suffix=.mustache
spring.mustache.check-template-location=true

# Logging
logging.level.com.bank.chiikawa=DEBUG

# \uc694\uac74\uc815\uc758\uc11c \u975e\u6a5f\u80fd-B-01 \ub300\uc751: 1\ud68c/1\uc77c \uc774\uccb4\ud55c\ub3c4
transfer.limit.per-transaction=10000000
transfer.limit.per-day=50000000
